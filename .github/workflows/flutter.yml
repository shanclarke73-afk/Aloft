name: Flutter app

# Quick checks only (format, analyze, tests) on Linux, once per pull request. Nothing runs
# again when a pull request is merged, and GitHub never builds the iPhone or Android app:
# those are built on the Mac.
on:
  pull_request:
    paths: ['app/**', '.github/workflows/flutter.yml']

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
