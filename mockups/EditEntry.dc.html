<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Edit a shot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#237A85}a:hover{color:#1B5F67}
.card{background:#FFFFFF;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(18,38,58,.06),0 6px 20px rgba(18,38,58,.05)}
.seg{flex:1;height:38px;border:none;border-radius:10px;font:600 14px Inter,sans-serif;color:#5B6878;background:transparent}
.seg.on{background:#FFFFFF;color:#12263A;box-shadow:0 1px 3px rgba(18,38,58,.12)}
.line{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid #EEF2F6;gap:12px}
.line:last-child{border-bottom:none}
.lk{font-size:15px}
.lv{border:none;background:none;font:600 15px Inter,sans-serif;color:#237A85;padding:12px 0;text-align:right}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FB; color: #12263A; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="History.dc.html" style="font-size: 16px; text-decoration: none; padding: 12px 0">Cancel</a>
    <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 17px">Edit shot</span>
    <a href="History.dc.html" style="font-size: 16px; font-weight: 700; text-decoration: none; padding: 12px 0">Save</a>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; background: #FFF6F0; border: 1px solid #F3CDB6; border-radius: 14px; padding: 10px 12px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4532A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/></svg>
    <span style="font-size: 13px; color: #6B2E13; line-height: 1.35">Editing your shot from <strong>Thu, Nov 13, 8:12 PM</strong>. Charts and supply update when you save.</span>
  </div>

  <div class="card" style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; background: #EEF2F6; border-radius: 12px; padding: 4px; gap: 4px" role="group" aria-label="Enter dose in">
      <button class="seg on" aria-pressed="true">Units</button>
      <button class="seg" aria-pressed="false">mL</button>
      <button class="seg" aria-pressed="false">mg</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
      <label for="amt" style="position: absolute; left: -9999px">Amount in units</label>
      <input id="amt" value="20" inputmode="decimal" style="width: 100px; border: none; border-bottom: 2px solid #237A85; background: transparent; text-align: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 52px; font-weight: 800; color: #12263A; padding: 0">
      <span style="font-size: 20px; font-weight: 600; color: #5B6878">units</span>
    </div>
    <div style="background: #E4F1F2; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700; color: #1B5F67">= 0.20 mL = 2.0 mg tirzepatide</span>
      <span style="font-size: 13px; color: #33475B">Was 25 units (2.5 mg)</span>
    </div>
  </div>

  <div class="card" style="display: flex; flex-direction: column; padding: 2px 16px">
    <div class="line"><span class="lk">Vial</span><button class="lv">Lot 2611-04 (10 mg/mL)</button></div>
    <div class="line"><span class="lk">When</span><button class="lv">Thu, Nov 13, 8:12 PM</button></div>
    <div class="line"><span class="lk">Site</span><button class="lv">Abdomen, lower left</button></div>
    <div class="line"><label for="note" class="lk">Note</label><input id="note" value="Ran out, took less" style="border: none; background: transparent; text-align: right; font: 400 15px Inter, sans-serif; color: #12263A; width: 190px"></div>
  </div>

  <span style="font-size: 12px; color: #5B6878; text-align: center">Logged Nov 13 at 8:12 PM · edited just now</span>

  <a href="EditEntryDelete.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; border: 1px solid #F4C7C3; background: #FFFFFF; text-decoration: none; font: 700 15px Inter, sans-serif; color: #B42318">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    Delete this shot
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
