<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Log weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6FA3}a:hover{color:#1F4E75}
.card{background:#FFFFFF;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(18,38,58,.06),0 6px 20px rgba(18,38,58,.05)}
.key{height:50px;border:none;border-radius:12px;background:#FFFFFF;font:600 22px Inter,sans-serif;color:#12263A;box-shadow:0 1px 1px rgba(18,38,58,.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FB; color: #12263A; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="font-size: 16px; text-decoration: none; padding: 12px 0">Cancel</a>
    <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 17px">Weight</span>
    <a href="Main.dc.html" style="font-size: 16px; font-weight: 700; text-decoration: none; padding: 12px 0">Save</a>
  </div>

  <div class="card" style="display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <label for="wt" style="position: absolute; left: -9999px">Weight in pounds</label>
      <input id="wt" value="183.8" inputmode="decimal" style="width: 190px; border: none; background: transparent; text-align: right; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 64px; font-weight: 800; color: #12263A; padding: 0">
      <div style="display: flex; background: #EEF2F6; border-radius: 10px; padding: 3px; gap: 3px" role="group" aria-label="Unit">
        <button aria-pressed="true" style="width: 44px; height: 34px; border: none; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,38,58,.12); font: 600 14px Inter, sans-serif; color: #12263A">lb</button>
        <button aria-pressed="false" style="width: 44px; height: 34px; border: none; border-radius: 8px; background: transparent; font: 600 14px Inter, sans-serif; color: #5B6878">kg</button>
      </div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
      <span style="background: #E7F3EC; color: #1E5233; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px">−0.8 lb since Nov 13</span>
      <span style="background: #E7F3EC; color: #1E5233; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px">−13.2 lb since you started</span>
    </div>
  </div>

  <div class="card" style="display: flex; flex-direction: column; padding: 2px 16px">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid #EEF2F6">
      <span style="font-size: 15px">When</span>
      <button style="border: none; background: none; font: 600 15px Inter, sans-serif; color: #2F6FA3; padding: 12px 0">Today, 7:10 AM</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid #EEF2F6">
      <label for="hk" style="font-size: 15px">Save to Apple Health</label>
      <input id="hk" type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F8F">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px">
      <label for="note" style="font-size: 15px">Note</label>
      <input id="note" placeholder="Optional" style="border: none; background: transparent; text-align: right; font: 400 15px Inter, sans-serif; color: #12263A; width: 180px">
    </div>
  </div>

  <a href="LogMeasurements.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; text-decoration: none; padding: 6px 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6FA3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add measurements too
  </a>

  <div style="margin: auto -20px 0; background: #D9DFE6; padding: 8px 8px 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px" aria-hidden="true">
    <button class="key" tabindex="-1">1</button><button class="key" tabindex="-1">2</button><button class="key" tabindex="-1">3</button>
    <button class="key" tabindex="-1">4</button><button class="key" tabindex="-1">5</button><button class="key" tabindex="-1">6</button>
    <button class="key" tabindex="-1">7</button><button class="key" tabindex="-1">8</button><button class="key" tabindex="-1">9</button>
    <button class="key" tabindex="-1">.</button><button class="key" tabindex="-1">0</button><button class="key" tabindex="-1">⌫</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
