<style>
body{margin:0}
a{color:#2F6FA3}a:hover{color:#1F4E75}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #E3E8EF;display:flex;justify-content:space-around;padding-top:8px;box-sizing:border-box}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#5B6878;text-decoration:none;width:64px;min-height:44px}
.tab:hover{color:#12263A}
.tab.on{color:#2F6FA3;font-weight:600}
.card{background:#FFFFFF;border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(18,38,58,.06),0 6px 20px rgba(18,38,58,.05)}
.seg{flex:1;height:36px;border:none;border-radius:10px;font:600 14px Inter,sans-serif;color:#5B6878;background:transparent}
.seg.on{background:#FFFFFF;color:#12263A;box-shadow:0 1px 3px rgba(18,38,58,.12)}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid #D5DDE6;background:#FFFFFF;color:#33475B;font:600 13px Inter,sans-serif}
.chip.on{background:#12263A;color:#FFFFFF;border-color:#12263A}
.date{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid #D5DDE6;background:#FFFFFF;border-radius:12px;padding:6px 12px;font-family:Inter,sans-serif;color:#12263A;min-height:44px}
.lane{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.track{position:relative;height:22px;border-radius:6px;background:#EEF2F6;overflow:hidden}
.seg2{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;font-size:11px;font-weight:700;color:#FFFFFF;box-sizing:border-box}
