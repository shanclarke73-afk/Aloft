<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Log measurements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#237A85}a:hover{color:#1B5F67}
.card{background:#FFFFFF;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(18,38,58,.06),0 6px 20px rgba(18,38,58,.05)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 88px 64px;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid #EEF2F6}
.mrow:last-child{border-bottom:none}
.ml{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.mi{box-sizing:border-box;width:88px;height:40px;border:1px solid #D5DDE6;border-radius:10px;padding:0 10px;text-align:right;font:600 16px Inter,sans-serif;color:#12263A;background:#FFFFFF}
.md{font-size:12px;font-weight:700;color:#1E6B3C;text-align:right}
.side{height:24px;padding:0 8px;border-radius:999px;border:1px solid #D5DDE6;background:#F6F8FB;font:700 11px Inter,sans-serif;color:#33475B}
.info{width:24px;height:24px;border-radius:12px;border:none;background:#EEF2F6;color:#237A85;font:700 13px Inter,sans-serif;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FB; color: #12263A; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="QuickAdd.dc.html" style="font-size: 16px; text-decoration: none; padding: 12px 0">Cancel</a>
    <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 17px">Measurements</span>
    <a href="Main.dc.html" style="font-size: 16px; font-weight: 700; text-decoration: none; padding: 12px 0">Save</a>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 13px; color: #4A5A6B">Today · compared with Sep 4</span>
    <div style="display: flex; background: #EEF2F6; border-radius: 10px; padding: 3px; gap: 3px" role="group" aria-label="Unit">
      <button aria-pressed="true" style="width: 44px; height: 32px; border: none; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,38,58,.12); font: 600 14px Inter, sans-serif; color: #12263A">in</button>
      <button aria-pressed="false" style="width: 44px; height: 32px; border: none; border-radius: 8px; background: transparent; font: 600 14px Inter, sans-serif; color: #5B6878">cm</button>
    </div>
  </div>

  <div class="card" style="display: flex; gap: 14px; align-items: center; border: 2px solid #CDE5E8">
    <svg width="74" height="128" viewBox="0 0 110 190" fill="none" role="img" aria-label="Where to measure your waist: around your belly button">
      <circle cx="55" cy="18" r="13" stroke="#B7C3D0" stroke-width="2"/>
      <path d="M32 38 Q55 30 78 38 L86 92 L80 94 L76 62 L74 110 L80 186 L64 186 L57 116 L53 116 L46 186 L30 186 L36 110 L34 62 L30 94 L24 92 Z" stroke="#B7C3D0" stroke-width="2" stroke-linejoin="round"/>
      <path d="M30 84 Q55 92 80 84" stroke="#1D3557" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="55" cy="88" r="3" fill="#E07A4F"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
      <span style="font-size: 13px; font-weight: 700; color: #1B5F67; text-transform: uppercase; letter-spacing: 0.4px">Waist · main one</span>
      <div style="display: flex; align-items: baseline; gap: 6px">
        <label for="waist" style="position: absolute; left: -9999px">Waist in inches</label>
        <input id="waist" value="38.5" inputmode="decimal" style="width: 104px; border: none; border-bottom: 2px solid #1D3557; background: transparent; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 36px; font-weight: 800; color: #12263A; padding: 0">
        <span style="font-size: 16px; font-weight: 600; color: #5B6878">in</span>
      </div>
      <span style="font-size: 13px; font-weight: 700; color: #1E6B3C">−3.1 in since Sep 4</span>
      <span style="font-size: 12px; color: #4A5A6B; line-height: 1.35">At your belly button. Tape snug, not tight. Measure after breathing out.</span>
    </div>
  </div>

  <div class="card" style="padding: 2px 16px">
    <div class="mrow"><span class="ml">Hips <button class="info" aria-label="How to measure hips">i</button></span><input class="mi" value="44.0" aria-label="Hips in inches"><span class="md">−2.0</span></div>
    <div class="mrow"><span class="ml">Chest <button class="info" aria-label="How to measure chest">i</button></span><input class="mi" value="42.5" aria-label="Chest in inches"><span class="md">−1.5</span></div>
    <div class="mrow"><span class="ml">Neck <button class="info" aria-label="How to measure neck">i</button></span><input class="mi" value="15.0" aria-label="Neck in inches"><span class="md">−0.5</span></div>
    <div class="mrow"><span class="ml">Upper arm <button class="side" aria-label="Right arm, tap to switch">R</button></span><input class="mi" value="13.5" aria-label="Right upper arm in inches"><span class="md">−0.8</span></div>
    <div class="mrow"><span class="ml">Thigh <button class="side" aria-label="Right thigh, tap to switch">R</button></span><input class="mi" placeholder="—" aria-label="Right thigh in inches"><span class="md" style="color: #5B6878; font-weight: 600">skip</span></div>
  </div>

  <button style="display: flex; align-items: center; gap: 8px; border: 1px dashed #B7C3D0; background: #FFFFFF; border-radius: 14px; height: 46px; padding: 0 14px; font: 600 15px Inter, sans-serif; color: #237A85">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#237A85" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add your own (e.g. under bust, calf)
  </button>

  <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px">
    <span style="display: flex; flex-direction: column"><label for="rem" style="font-size: 15px; font-weight: 600">Remind me every 4 weeks</label><span style="font-size: 12px; color: #5B6878">Same day as progress photos</span></span>
    <input id="rem" type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1D3557; flex-shrink: 0">
  </div>

  <span style="font-size: 12px; color: #5B6878; text-align: center">Leave any blank. Only waist is suggested.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
