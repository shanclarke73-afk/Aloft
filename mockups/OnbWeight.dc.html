<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Starting weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#237A85}a:hover{color:#1B5F67}
.card{background:#FFFFFF;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(18,38,58,.06),0 6px 20px rgba(18,38,58,.05)}
.lbl{font-size:13px;font-weight:600;color:#4A5A6B}
.inp{box-sizing:border-box;width:100%;height:46px;border:1px solid #D5DDE6;border-radius:12px;padding:0 12px;font:500 16px Inter,sans-serif;color:#12263A;background:#FFFFFF}
.fld{display:flex;flex-direction:column;gap:5px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FB; color: #12263A; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 24px 32px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="OnbDose.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#237A85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #5B6878">Step 4 of 6</span>
    <a href="OnbPhotos.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 0">Skip</a>
  </div>
  <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 28px; font-weight: 800; line-height: 1.15">Where you're starting</h1>
  <p style="margin: 0; font-size: 15px; color: #4A5A6B; line-height: 1.4">Already on a GLP-1? Use your weight from when you began, so your progress counts from day one.</p>

  <button style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #D5DDE6; border-radius: 16px; padding: 12px 14px; text-align: left; font-family: Inter, sans-serif; color: #12263A; min-height: 60px">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #FDECEF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4233F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    </div>
    <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Import from Apple Health</span><span style="font-size: 13px; color: #5B6878">Brings in your weight history (Health Connect on Android)</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="card" style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; align-items: end">
      <div class="fld">
        <label class="lbl" for="sw">Starting weight</label>
        <input id="sw" class="inp" value="197.0" inputmode="decimal" style="font-size: 20px; font-weight: 700">
      </div>
      <div style="display: flex; background: #EEF2F6; border-radius: 12px; padding: 3px; gap: 3px; height: 46px; box-sizing: border-box" role="group" aria-label="Weight unit">
        <button aria-pressed="true" style="flex: 1; border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,38,58,.12); font: 600 14px Inter, sans-serif; color: #12263A">lb</button>
        <button aria-pressed="false" style="flex: 1; border: none; border-radius: 9px; background: transparent; font: 600 14px Inter, sans-serif; color: #5B6878">kg</button>
      </div>
    </div>
    <div class="fld">
      <label class="lbl" for="sd">When you started your GLP-1</label>
      <input id="sd" class="inp" value="Sep 4, 2026">
    </div>
    <div class="fld">
      <label class="lbl" for="gw">Goal weight (optional)</label>
      <input id="gw" class="inp" placeholder="Leave blank if you'd rather not">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <span style="display: flex; flex-direction: column"><label for="bmi" style="font-size: 15px; font-weight: 500">Show BMI</label><span style="font-size: 12px; color: #5B6878">Needs your height. Off by default.</span></span>
      <input id="bmi" type="checkbox" style="width: 22px; height: 22px; accent-color: #1D3557">
    </div>
  </div>

  <a href="OnbPhotos.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #1D3557; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">Continue</a>
</div>
</x-dc>

</body>
</html>
