<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Privacy and finish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#237A85}a:hover{color:#1B5F67}
.group{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 2px rgba(18,38,58,.06);display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:54px;border-bottom:1px solid #EEF2F6;box-sizing:border-box}
.row:last-child{border-bottom:none}
.ic{width:36px;height:36px;border-radius:11px;background:#E4F1F2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rt{font-size:15px;font-weight:600}
.rs{font-size:12px;color:#5B6878}
.tg{width:22px;height:22px;accent-color:#1D3557;flex-shrink:0}
.sec{font-size:13px;font-weight:700;color:#4A5A6B;text-transform:uppercase;letter-spacing:0.4px;margin:2px 4px 0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FB; color: #12263A; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="OnbPhotos.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#237A85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #5B6878">Step 6 of 6</span>
    <span style="width: 44px"></span>
  </div>
  <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 28px; font-weight: 800; line-height: 1.15">Private and safe</h1>

  <span class="sec">Protect</span>
  <div class="group">
    <div class="row">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#237A85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="lock" class="rt">Lock with Face ID</label><span class="rs">Asked each time you open Aloft</span></span>
      <input id="lock" type="checkbox" class="tg" checked>
    </div>
    <div class="row">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#237A85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/><path d="M12 15v-4M10 13l2-2 2 2"/></svg></div>
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="bk" class="rt">Back up to my iCloud</label><span class="rs">Photos included. We never see it.</span></span>
      <input id="bk" type="checkbox" class="tg" checked>
    </div>
  </div>

  <span class="sec">Remind me</span>
  <div class="group">
    <div class="row">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="r1" class="rt">Shot day</label><span class="rs">Thursdays, 8:00 PM</span></span>
      <input id="r1" type="checkbox" class="tg" checked>
    </div>
    <div class="row">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="r2" class="rt">Reorder</label><span class="rs">When 2 doses are left</span></span>
      <input id="r2" type="checkbox" class="tg" checked>
    </div>
    <div class="row">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="r3" class="rt">Progress photos</label><span class="rs">Optional · monthly if you turn it on</span></span>
      <input id="r3" type="checkbox" class="tg">
    </div>
    <div class="row">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><label for="r4" class="rt">Weigh-in</label><span class="rs">Off. Turn on anytime.</span></span>
      <input id="r4" type="checkbox" class="tg">
    </div>
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; background: #FFF6F0; border: 1px solid #F3CDB6; border-radius: 16px; padding: 12px 14px; margin-top: 2px">
    <input id="ack" type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1D3557; flex-shrink: 0; margin: 1px 0 0">
    <label for="ack" style="font-size: 13px; color: #6B2E13; line-height: 1.4">I understand Aloft is a tracking tool, not medical advice. It never tells me how much to take. I'll follow my prescriber.</label>
  </div>

  <a href="Main.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #1D3557; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">Start using Aloft</a>
</div>
</x-dc>

</body>
</html>
