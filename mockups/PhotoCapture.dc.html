<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloft · Progress photo capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CDE5E8}a:hover{color:#FFFFFF}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#E6EDF4;font:600 14px Inter,sans-serif}
.chip.on{background:#FFFFFF;color:#0E1A26;border-color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1A26; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="PhotoCompare.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 17px">Front · Week 12</span>
      <span style="font-size: 12px; color: #B7C3D0">Nov 20, 2026</span>
    </div>
    <button aria-label="Timer 10 seconds" style="height: 44px; padding: 0 12px; border-radius: 22px; border: none; background: rgba(255,255,255,.12); color: #FFFFFF; font: 700 14px Inter, sans-serif; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>
      10s
    </button>
  </div>

  <div style="flex-grow: 1; border-radius: 24px; background: #1B2B3B; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg width="300" height="520" viewBox="0 0 300 520" fill="none" role="img" aria-label="Faint outline of your last front photo to line up with">
      <circle cx="150" cy="70" r="40" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M86 128 Q150 108 214 128 L238 268 L220 274 L208 186 L204 312 L222 500 L176 500 L156 340 L144 340 L124 500 L78 500 L96 312 L92 186 L80 274 L62 268 Z" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6" stroke-linejoin="round"/>
      <path d="M150 0V520M0 260H300" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </svg>
    <div style="position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: center">
      <span style="background: rgba(14,26,38,.72); padding: 8px 12px; border-radius: 999px; font-size: 13px; color: #E6EDF4">Line up with your last front photo (Oct 23)</span>
    </div>
    <div style="position: absolute; bottom: 14px; right: 14px; display: flex; align-items: center; gap: 8px; background: rgba(14,26,38,.72); padding: 8px 12px; border-radius: 999px">
      <label for="ghost" style="font-size: 13px; color: #E6EDF4">Outline</label>
      <input id="ghost" type="checkbox" checked style="width: 20px; height: 20px; accent-color: #E07A4F">
    </div>
  </div>

  <div style="display: flex; justify-content: center; gap: 8px" role="group" aria-label="Pose">
    <button class="chip on" aria-pressed="true">Front</button>
    <button class="chip" aria-pressed="false">Side</button>
    <button class="chip" aria-pressed="false">Back</button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button aria-label="Import from photo library" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28); background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button aria-label="Take photo" style="width: 78px; height: 78px; border-radius: 39px; border: 4px solid #FFFFFF; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center">
      <span style="display: block; width: 62px; height: 62px; border-radius: 31px; background: #FFFFFF"></span>
    </button>
    <button aria-label="Switch camera" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28); background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #B7C3D0">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B7C3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    Saved only inside Aloft, never to your camera roll
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
