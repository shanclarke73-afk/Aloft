name: aloft
description: "Aloft: GLP-1 Shot Tracker"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.9.1
  uuid: ^4.6.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
flutter:
  uses-material-design: true

# Build SQLite with SQLCipher so the database is encrypted at rest (SPEC section 3).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
