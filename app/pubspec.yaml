name: aloft
description: "Aloft: GLP-1 Shot Tracker"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+3

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.9.1
  uuid: ^4.6.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  fl_chart: ^1.3.1
  file_picker: ^13.4.1
  image_picker: ^1.2.4
  exif: ^3.3.0
  archive: ^4.7.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  purchases_flutter: ^11.0.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon-rounded.png
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/PlusJakartaSans-OFL.txt
  # Both are variable fonts under the SIL Open Font License (texts alongside them).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

# App icons are generated from the artwork in brand/: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: ../brand/ios-appstore-1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1D3557"
  adaptive_icon_foreground: ../brand/android-foreground-432.png

# Build SQLite with SQLCipher so the database is encrypted at rest (SPEC section 3).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
